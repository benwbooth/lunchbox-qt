[workspace]
resolver = "2"
members = [
    "apps/lb-shell",
    "crates/lb-domain",
    "crates/lb-import",
    "crates/lb-integrations",
    "crates/lb-metadata",
    "crates/lb-platform",
    "crates/lb-query",
    "crates/lb-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Ben"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cxx = "1.0"
cxx-qt = "0.8.1"
cxx-qt-build = "0.8.1"
cxx-qt-lib = { version = "0.8.1", features = ["qt_full"] }
fs2 = "0.4"
lb-domain = { path = "crates/lb-domain" }
lb-import = { path = "crates/lb-import" }
lb-integrations = { path = "crates/lb-integrations" }
lb-metadata = { path = "crates/lb-metadata" }
lb-platform = { path = "crates/lb-platform" }
lb-query = { path = "crates/lb-query" }
lb-storage = { path = "crates/lb-storage" }
md-5 = "0.10"
quick-xml = { version = "0.38", features = ["serialize"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
xmltree = "0.11"
